name: PlatformIO CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache PlatformIO core, toolchains, & packages to speed up pipeline builds
      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # 4. Install PlatformIO Core
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # 5. Build all target environments defined in platformio.ini
      - name: Run PlatformIO Build
        run: pio run

      # 6. (Optional) Run Unit Tests if present in /test folder
      # Note: requires unit test implementation compatible with native/host or QEMU
      - name: Run Unit Tests
        run: pio test -e uno
        continue-on-error: true

      # 7. (Optional) Upload build artifacts (.hex or .bin firmware files)
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: .pio/build/*/*.bin